[project]
name = "transformer-gpt-assignment"
version = "0.1.0"
description = "MiniGPT: a causal Transformer language model built from scratch in PyTorch"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy", "pyyaml", "matplotlib"]

[project.optional-dependencies]
api = ["fastapi", "uvicorn", "httpx"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
